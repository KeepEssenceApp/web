<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KeepEssence</title>
    <meta name="theme-color" content="#0B0B0B" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="KeepEssence" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      // A page fetched just before a new version went out names script and style files that are
      // gone by the time it asks for them, and nothing would be drawn (QA #77). Ask for the page
      // again, once; if that does not help either, say so instead of staying blank.
      addEventListener(
        "error",
        function (ev) {
          var el = ev.target;
          var src = el && (el.src || el.href);
          if (!src || !/\/assets\//.test(src) || !/^(SCRIPT|LINK)$/.test(el.tagName)) return;
          var tried = false;
          try {
            tried = sessionStorage.getItem("ke.reloaded") === src;
            sessionStorage.setItem("ke.reloaded", src);
          } catch (e) {}
          if (!tried) return location.reload();
          var app = document.getElementById("app");
          if (app && !app.firstChild) app.textContent = "KeepEssence could not be loaded. Reload the page. / 页面没有载入，请刷新。";
        },
        true
      );
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
