# Publishes a version from the commit messages once the checks on main have passed.
# The major version follows the API contract (/v1): see the contributing guide.
name: release
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency: release
jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes -p semantic-release@24 -p conventional-changelog-conventionalcommits@8 semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
